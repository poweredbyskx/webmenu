{% extends "base.html" %}
{% load static %}

{% block title %}Выберите точку{% endblock %}

{% block content %}
<div class="page">
  <div class="select-venue">
    <h1 class="select-venue__title">Выберите заведение</h1>
    <div class="select-venue__list">
      {% for venue in venues %}
        <a href="{% url 'set_venue' venue.slug %}?next={{ next|urlencode }}" class="btn-menu">{{ venue.name }}</a>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
